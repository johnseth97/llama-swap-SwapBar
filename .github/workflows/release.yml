name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # See ci.yml for why this project needs the xcode-27 preview runner.
    runs-on: xcode-27
    permissions:
      contents: write

    env:
      APP_NAME: SwapBar
      SCHEME: SwapBar
      KEYCHAIN_NAME: swapbar-release.keychain-db

    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate into a temporary keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          echo -n "$DEVELOPER_ID_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import "$CERT_PATH" -k "$KEYCHAIN_NAME" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          # Put it ahead of the default keychains so xcodebuild finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

      - name: Archive
        # Automatic signing (the project's default for local dev builds) looks for a "Mac
        # Development" identity, which we don't have in CI — only a Developer ID Application
        # cert. Override to manual signing with that identity for the archive itself; export
        # signing is controlled separately by ExportOptions.plist.
        run: >
          xcodebuild archive
          -project SwapBar.xcodeproj
          -scheme "$SCHEME"
          -configuration Release
          -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive"
          -destination 'generic/platform=macOS'
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Developer ID Application"
          DEVELOPMENT_TEAM=427Y9Z8Y78
          PROVISIONING_PROFILE_SPECIFIER=""

      - name: Export (Developer ID signed)
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive"
          -exportPath "$RUNNER_TEMP/export"
          -exportOptionsPlist ExportOptions.plist

      - name: Notarize
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$AC_API_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"

          ditto -c -k --keepParent "$RUNNER_TEMP/export/$APP_NAME.app" "$RUNNER_TEMP/$APP_NAME.zip"

          xcrun notarytool submit "$RUNNER_TEMP/$APP_NAME.zip" \
            --key "$KEY_PATH" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/export/$APP_NAME.app"
          rm -f "$KEY_PATH"

      - name: Build DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          VERSION="${GITHUB_REF_NAME#v}"
          DMG_PATH="$RUNNER_TEMP/$APP_NAME-$VERSION.dmg"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING" -ov -format UDZO "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Compute checksum
        run: |
          shasum -a 256 "$DMG_PATH" | tee "$RUNNER_TEMP/checksum.txt"
          echo "SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH" \
            --title "SwapBar $VERSION" \
            --notes "SHA256: $SHA256"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME" || true
